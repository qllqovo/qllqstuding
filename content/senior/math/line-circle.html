<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>直线与圆的方程 · 交互演示</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='8' fill='%235a7a6b'/%3E%3C/svg%3E">
  <script src="../../../assets/js/tex.js"></script>
  <style>
    :root {
      --line: #5a7a6b;       /* 苔绿：直线 */
      --circle: #7ba0b8;     /* 灰蓝：圆 */
      --circle2: #a89279;    /* 木色：圆2 */
      --warn: #c9a88c;
      --grid: rgba(168, 146, 121, 0.18);
      --ink: #3d3d3d;
      --muted: #a89279;
      --paper: #f5f0eb;
      --soft: rgba(255, 255, 255, 0.6);
      --border: rgba(201, 168, 140, 0.3);
      --border-strong: rgba(201, 168, 140, 0.8);
      --slow: 700ms ease-in-out;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--paper);
      color: var(--ink);
      font-weight: 300;
      line-height: 1.8;
    }

    .page-head {
      max-width: 1040px;
      margin: 0 auto;
      padding: 32px 40px 0;
    }
    .page-head h1 { font-size: 26px; font-weight: 300; }
    .page-head p { font-size: 13px; color: var(--muted); margin-top: 4px; }

    .seg {
      display: inline-flex;
      margin-top: 24px;
      border: 1px solid var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .seg button {
      padding: 10px 28px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.12em;
      cursor: pointer;
      font-family: inherit;
      transition: background var(--slow), color var(--slow);
    }
    .seg button + button { border-left: 1px solid var(--border); }
    .seg button.active { background: var(--ink); color: var(--paper); }

    .layout {
      max-width: 1040px;
      margin: 32px auto 64px;
      padding: 0 40px;
      display: grid;
      grid-template-columns: 5fr 4fr;
      gap: 40px;
      align-items: start;
    }

    .canvas-card {
      background: var(--soft);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 24px;
    }
    .canvas-card h3 {
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }
    #graph {
      width: 100%;
      height: 420px;
      display: block;
      touch-action: none;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 16px;
      font-size: 12px;
      color: var(--muted);
    }
    .legend span { display: inline-flex; align-items: center; gap: 8px; }
    .swatch { width: 18px; height: 2px; display: inline-block; }

    .panel { display: flex; flex-direction: column; gap: 24px; }
    .block {
      background: var(--soft);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 24px;
    }
    .block h3 {
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .param { display: none; flex-direction: column; gap: 14px; }
    .param.active { display: flex; }
    .row {
      display: grid;
      grid-template-columns: 64px 1fr 48px;
      align-items: center;
      gap: 12px;
    }
    .row label { font-size: 13px; color: var(--ink); }
    .row output {
      font-size: 13px;
      text-align: right;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 1px;
      background: var(--border-strong);
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--ink);
      border: none;
      cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--ink);
      border: none;
      cursor: pointer;
    }
    .subhead {
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
      margin: 6px 0 -4px;
    }

    .eq { font-size: 15px; margin: 8px 0; overflow-x: auto; overflow-y: hidden; }
    .verdict {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 16px;
      border: 1px solid var(--border-strong);
      border-radius: 2px;
      font-size: 14px;
      color: var(--ink);
    }
    .steps { font-size: 13px; display: flex; flex-direction: column; gap: 10px; }
    .steps .step { color: var(--ink); }
    .steps .num {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.12em;
      margin-right: 8px;
    }
    .note { font-size: 12px; color: var(--muted); margin-top: 12px; }

    @media (max-width: 860px) {
      .page-head { padding: 24px 24px 0; }
      .layout { grid-template-columns: 1fr; padding: 0 24px; gap: 24px; }
      #graph { height: 320px; }
      .seg button { padding: 10px 20px; }
    }
    @media (max-width: 420px) {
      .page-head, .layout { padding-left: 16px; padding-right: 16px; }
      .canvas-card, .block { padding: 16px; }
      #graph { height: 280px; }
    }
  </style>
</head>
<body>
  <div class="content-topbar">
    <button class="nav-back" type="button" onclick="Qllq.go('../../../pages/subject-home.html?grade=senior&subject=math')">← 返回科目</button>
    <span class="crumb">高中 · 数学</span>
  </div>
  <script src="../../../assets/js/app.js"></script>
  <script>if(window.Qllq&&!Qllq.isAuthed()){Qllq.go('../../../index.html');}</script>

  <div class="page-head">
    <h1>直线与圆的方程 · 交互演示</h1>
    <p>拖动滑块改变参数，图形、方程与位置关系同步更新；手机端可横向滑动查看完整公式。</p>
    <div class="seg">
      <button class="active" data-mode="line-circle" onclick="switchMode('line-circle')">直线与圆</button>
      <button data-mode="circle-circle" onclick="switchMode('circle-circle')">圆与圆</button>
    </div>
  </div>

  <div class="layout">
    <div class="canvas-card">
      <h3>坐标平面</h3>
      <canvas id="graph"></canvas>
      <div class="legend" id="legend"></div>
    </div>

    <div class="panel">
      <div class="block">
        <h3>参数调节</h3>
        <div class="param active" id="p-lc">
          <div class="row"><label>斜率 k</label><input type="range" id="lk" min="-5" max="5" step="0.1" value="1"><output id="ovk">1.0</output></div>
          <div class="row"><label>截距 b</label><input type="range" id="lb" min="-5" max="5" step="0.1" value="1"><output id="ovb">1.0</output></div>
          <div class="row"><label>圆心 h</label><input type="range" id="lh" min="-6" max="6" step="0.1" value="0"><output id="ovh">0.0</output></div>
          <div class="row"><label>圆心 k</label><input type="range" id="lkc" min="-6" max="6" step="0.1" value="-2"><output id="ovkc">-2.0</output></div>
          <div class="row"><label>半径 r</label><input type="range" id="lr" min="0.2" max="5" step="0.1" value="2"><output id="ovr">2.0</output></div>
        </div>
        <div class="param" id="p-cc">
          <div class="subhead">圆 1</div>
          <div class="row"><label>h₁</label><input type="range" id="lh1" min="-5" max="5" step="0.1" value="-2"><output id="ovh1">-2.0</output></div>
          <div class="row"><label>k₁</label><input type="range" id="lk1" min="-5" max="5" step="0.1" value="0"><output id="ovk1">0.0</output></div>
          <div class="row"><label>r₁</label><input type="range" id="lr1" min="0.5" max="4" step="0.1" value="2"><output id="ovr1">2.0</output></div>
          <div class="subhead">圆 2</div>
          <div class="row"><label>h₂</label><input type="range" id="lh2" min="-5" max="5" step="0.1" value="3"><output id="ovh2">3.0</output></div>
          <div class="row"><label>k₂</label><input type="range" id="lk2" min="-5" max="5" step="0.1" value="1"><output id="ovk2">1.0</output></div>
          <div class="row"><label>r₂</label><input type="range" id="lr2" min="0.5" max="4" step="0.1" value="1.5"><output id="ovr2">1.5</output></div>
        </div>
      </div>

      <div class="block">
        <h3>当前方程</h3>
        <div class="eq" id="eq1"></div>
        <div class="eq" id="eq2"></div>
      </div>

      <div class="block">
        <h3>判定与推导</h3>
        <div class="steps" id="steps"></div>
        <div class="verdict" id="verdict"></div>
      </div>
    </div>
  </div>

<script>
(function () {
  var canvas = document.getElementById('graph');
  var ctx = canvas.getContext('2d');
  var RANGE = 10;
  var mode = 'line-circle';
  var W, H, scale, ox, oy;

  function $(id) { return document.getElementById(id); }
  var ids = ['lk','lb','lh','lkc','lr','lh1','lk1','lr1','lh2','lk2','lr2'];
  var el = {};
  ids.forEach(function (id) { el[id] = $(id); });

  function m2p(mx, my) { return { x: ox + mx * scale, y: oy - my * scale }; }

  function fitCanvas() {
    var dpr = window.devicePixelRatio || 1;
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var pad = 28;
    scale = Math.min((W - 2 * pad) / (2 * RANGE), (H - 2 * pad) / (2 * RANGE));
    ox = W / 2; oy = H / 2;
  }

  function drawGrid() {
    ctx.clearRect(0, 0, W, H);
    ctx.lineWidth = 1;
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid').trim() || '#e5ddd4';
    for (var i = -RANGE; i <= RANGE; i++) {
      if (i === 0) continue;
      var a = m2p(i, 0), b = m2p(0, i);
      ctx.beginPath(); ctx.moveTo(a.x, 0); ctx.lineTo(a.x, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, b.y); ctx.lineTo(W, b.y); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(61,61,61,0.55)';
    ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(W, oy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox, oy); ctx.stroke();
    ctx.fillStyle = '#a89279';
    ctx.font = '11px sans-serif';
    for (var t = -RANGE; t <= RANGE; t += 2) {
      if (t === 0) continue;
      var px = m2p(t, 0), py = m2p(0, t);
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(t, px.x, oy + 5);
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillText(t, ox - 6, py.y);
    }
    ctx.fillStyle = '#3d3d3d';
    ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
    ctx.fillText('O', ox - 4, oy - 4);
    ctx.textAlign = 'left';
    ctx.fillText('x', W - 12, oy - 6);
    ctx.fillText('y', ox + 6, 12);
  }

  function drawLine(k, b) {
    var p1 = m2p(-RANGE, k * -RANGE + b);
    var p2 = m2p(RANGE, k * RANGE + b);
    ctx.strokeStyle = '#5a7a6b';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
    var lp = m2p(0, b);
    ctx.fillStyle = '#5a7a6b';
    ctx.font = '12px sans-serif';
    ctx.textAlign = lp.x > W - 70 ? 'right' : 'left';
    ctx.textBaseline = 'bottom';
    ctx.fillText('l: y=' + k.toFixed(1) + 'x' + (b >= 0 ? '+' : '') + b.toFixed(1), lp.x + 4, lp.y - 4);
  }

  function drawCircle(h, k, r, color) {
    var c = m2p(h, k);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(c.x, c.y, r * scale, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(c.x, c.y, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText('(' + h.toFixed(1) + ',' + k.toFixed(1) + ')', c.x + 6, c.y + 4);
  }

  function dot(mx, my, color, radius) {
    var p = m2p(mx, my);
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(p.x, p.y, radius || 4, 0, Math.PI * 2); ctx.fill();
  }

  function dashed(a, b, color) {
    ctx.save();
    ctx.setLineDash([5, 5]);
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.restore();
  }

  function lineCircleModel(k, b, h, kc, r) {
    var A = k, B = -1, C = b;
    var d = Math.abs(A * h + B * kc + C) / Math.sqrt(A * A + B * B);
    var t0 = (A * h + B * kc + C) / (A * A + B * B);
    var foot = { x: h - A * t0, y: kc - B * t0 };
    var q = b - kc;
    var qa = 1 + k * k, qb = -2 * h + 2 * k * q, qc = h * h + q * q - r * r;
    var disc = qb * qb - 4 * qa * qc;
    var pts = [];
    if (disc > 1e-6) {
      var s = Math.sqrt(disc);
      [-1, 1].forEach(function (sg) {
        var x = (-qb + sg * s) / (2 * qa);
        pts.push({ x: x, y: k * x + b });
      });
    } else if (Math.abs(disc) <= 1e-6) {
      var x0 = -qb / (2 * qa);
      pts.push({ x: x0, y: k * x0 + b });
    }
    var status;
    if (d > r + 1e-3) status = '相离';
    else if (Math.abs(d - r) <= 1e-3) status = '相切';
    else status = '相交';
    return { d: d, foot: foot, pts: pts, status: status };
  }

  function circleCircleModel(h1, k1, r1, h2, k2, r2) {
    var d = Math.hypot(h1 - h2, k1 - k2);
    var sum = r1 + r2, diff = Math.abs(r1 - r2);
    var status;
    if (d > sum + 1e-3) status = '外离';
    else if (Math.abs(d - sum) <= 1e-3) status = '外切';
    else if (d > diff + 1e-3 && d < sum - 1e-3) status = '相交';
    else if (Math.abs(d - diff) <= 1e-3) status = '内切';
    else status = '内含';
    return { d: d, sum: sum, diff: diff, status: status };
  }

  function tex(s) { return '\\(' + s + '\\)'; }
  function renderInto(node) { if (window.QllqTex) { QllqTex.render(node); } }

  function render() {
    fitCanvas();
    drawGrid();

    if (mode === 'line-circle') {
      var k = +el.lk.value, b = +el.lb.value, h = +el.lh.value, kc = +el.lkc.value, r = +el.lr.value;
      drawLine(k, b);
      drawCircle(h, kc, r, '#7ba0b8');
      var m = lineCircleModel(k, b, h, kc, r);
      var fp = m2p(m.foot.x, m.foot.y);
      var cp = m2p(h, kc);
      dashed(cp, fp, '#a89279');
      dot(m.foot.x, m.foot.y, '#a89279', 3.5);
      m.pts.forEach(function (pt) { dot(pt.x, pt.y, '#3d3d3d', 4); });

      $('eq1').innerHTML = tex('l: y = ' + k.toFixed(1) + 'x ' + (b >= 0 ? '+' : '-') + ' ' + Math.abs(b).toFixed(1));
      $('eq2').innerHTML = tex('C: (x ' + (h >= 0 ? '-' : '+') + ' ' + Math.abs(h).toFixed(1) + ')^2 + (y ' + (kc >= 0 ? '-' : '+') + ' ' + Math.abs(kc).toFixed(1) + ')^2 = ' + r.toFixed(1) + '^2');

      $('steps').innerHTML =
        '<div class="step"><span class="num">01</span>圆心到直线距离 ' + tex('d = \\dfrac{|' + k.toFixed(1) + '\\times' + h.toFixed(1) + ' + (-1)\\times(' + kc.toFixed(1) + ') + ' + b.toFixed(1) + '|}{\\sqrt{' + k.toFixed(1) + '^2+1}} = ' + m.d.toFixed(3)) + '</div>' +
        '<div class="step"><span class="num">02</span>比较 ' + tex('d = ' + m.d.toFixed(3)) + ' 与 ' + tex('r = ' + r.toFixed(1)) + '</div>' +
        '<div class="step"><span class="num">03</span>交点数 ' + tex(m.pts.length) + '（图中深色点为公共点，虚线为垂线段）</div>';
      $('verdict').textContent = m.status + '（' + (m.status === '相离' ? '无公共点' : m.status === '相切' ? '一个公共点' : '两个公共点') + '）';

      ['ovk','ovb','ovh','ovkc','ovr'].forEach(function (id) { $(id).textContent = ({ovk:k,ovb:b,ovh:h,ovkc:kc,ovr:r})[id].toFixed(1); });
      renderInto($('steps')); renderInto($('eq1')); renderInto($('eq2'));

    } else {
      var h1 = +el.lh1.value, k1 = +el.lk1.value, r1 = +el.lr1.value;
      var h2 = +el.lh2.value, k2 = +el.lk2.value, r2 = +el.lr2.value;
      drawCircle(h1, k1, r1, '#7ba0b8');
      drawCircle(h2, k2, r2, '#a89279');
      var c1 = m2p(h1, k1), c2 = m2p(h2, k2);
      dashed(c1, c2, '#c9a88c');
      var mm = circleCircleModel(h1, k1, r1, h2, k2, r2);

      $('eq1').innerHTML = tex('C_1: (x ' + (h1 >= 0 ? '-' : '+') + ' ' + Math.abs(h1).toFixed(1) + ')^2 + (y ' + (k1 >= 0 ? '-' : '+') + ' ' + Math.abs(k1).toFixed(1) + ')^2 = ' + r1.toFixed(1) + '^2');
      $('eq2').innerHTML = tex('C_2: (x ' + (h2 >= 0 ? '-' : '+') + ' ' + Math.abs(h2).toFixed(1) + ')^2 + (y ' + (k2 >= 0 ? '-' : '+') + ' ' + Math.abs(k2).toFixed(1) + ')^2 = ' + r2.toFixed(1) + '^2');

      $('steps').innerHTML =
        '<div class="step"><span class="num">01</span>圆心距 ' + tex('d = ' + mm.d.toFixed(3)) + '</div>' +
        '<div class="step"><span class="num">02</span>半径和 ' + tex('r_1+r_2 = ' + mm.sum.toFixed(2)) + '，半径差 ' + tex('|r_1-r_2| = ' + mm.diff.toFixed(2)) + '</div>' +
        '<div class="step"><span class="num">03</span>按 ' + tex('d') + ' 与和、差的大小关系判定（虚线为圆心连线）</div>';
      $('verdict').textContent = mm.status;

      [['ovh1',h1],['ovk1',k1],['ovr1',r1],['ovh2',h2],['ovk2',k2],['ovr2',r2]].forEach(function (pair) {
        $(pair[0]).textContent = pair[1].toFixed(1);
      });
      renderInto($('steps')); renderInto($('eq1')); renderInto($('eq2'));
    }
  }

  window.switchMode = function (m) {
    mode = m;
    document.querySelectorAll('.seg button').forEach(function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-mode') === m);
    });
    $('p-lc').classList.toggle('active', m === 'line-circle');
    $('p-cc').classList.toggle('active', m === 'circle-circle');
    $('legend').innerHTML = m === 'line-circle'
      ? '<span><i class="swatch" style="background:#5a7a6b"></i>直线</span><span><i class="swatch" style="background:#7ba0b8"></i>圆</span><span><i class="swatch" style="background:#a89279"></i>垂线段</span>'
      : '<span><i class="swatch" style="background:#7ba0b8"></i>圆 1</span><span><i class="swatch" style="background:#a89279"></i>圆 2</span><span><i class="swatch" style="background:#c9a88c"></i>圆心连线</span>';
    render();
  };

  ids.forEach(function (id) {
    el[id].addEventListener('input', render);
    el[id].addEventListener('change', render);
  });
  var rt;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(render, 120); });
  document.addEventListener('DOMContentLoaded', function () { window.switchMode('line-circle'); });
  window.switchMode('line-circle');
})();
</script>
</body>
</html>
