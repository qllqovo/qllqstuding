<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>科目内容 · qllqstuding</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='8' fill='%235a7a6b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../assets/css/nordic.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <button class="nav-back" id="backBtn" type="button">← 返回科目</button>
      <span class="breadcrumb" id="crumb"></span>
    </header>

    <section class="section" style="margin-top:80px;">
      <p class="text-label" id="gradeLabel"></p>
      <h1 class="text-display" style="margin:8px 0 16px;" id="subjectTitle"></h1>
      <p class="text-body-lg" style="color:var(--color-wood);max-width:34em;margin-bottom:56px;" id="subjectHint"></p>

      <div class="subject-grid" id="contentList"></div>

      <div class="hygge-card" id="emptyState" style="display:none;">
        <div class="card-title">内容筹备中</div>
        <div class="card-body">该科目的学习内容尚未整理完成，后续将在此分支补充。你可以先返回选择其他科目。</div>
      </div>
    </section>
  </main>

  <script src="../assets/js/app.js"></script>
  <script>
    (function () {
      if (!Qllq.guard('../index.html')) return;

      var grade = Qllq.getParam('grade') || Qllq.getGrade();
      var subject = Qllq.getParam('subject');

      if (grade !== 'junior' && grade !== 'senior') {
        Qllq.go('grade.html');
        return;
      }
      if (!subject) {
        Qllq.go('subject.html?grade=' + grade);
        return;
      }

      var subjectName = Qllq.getSubjectName(subject);
      document.getElementById('crumb').textContent =
        Qllq.gradeLabel(grade) + ' · ' + subjectName;
      document.getElementById('gradeLabel').textContent = Qllq.gradeLabel(grade);
      document.getElementById('subjectTitle').textContent = subjectName;

      document.getElementById('backBtn').addEventListener('click', function () {
        Qllq.go('subject.html?grade=' + grade);
      });

      var items = Qllq.getContent(grade, subject);
      var list = document.getElementById('contentList');
      var empty = document.getElementById('emptyState');

      if (!items.length) {
        empty.style.display = 'block';
        document.getElementById('subjectHint').textContent = '当前科目暂无可展示的内容。';
        return;
      }

      document.getElementById('subjectHint').textContent =
        '共 ' + items.length + ' 份学习资料，点击卡片进入。';

      items.forEach(function (item) {
        var card = document.createElement('button');
        card.type = 'button';
        card.className = 'subject-card';
        card.innerHTML =
          '<span class="subject-name">' + item.title + '</span>' +
          '<span class="subject-meta">查看资料 →</span>';
        card.addEventListener('click', function () {
          Qllq.go(item.file);
        });
        list.appendChild(card);
      });
    })();
  </script>
</body>
</html>
