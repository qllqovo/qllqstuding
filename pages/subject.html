<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>选择科目 · qllqstuding</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='8' fill='%235a7a6b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../assets/css/nordic.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <button class="nav-back" id="backBtn" type="button">← 返回年级</button>
      <span class="breadcrumb" id="gradeCrumb">Step 2 / 2</span>
    </header>

    <section class="section" style="margin-top:80px;">
      <p class="text-label">Subject</p>
      <h1 class="text-display" style="margin:8px 0 16px;">请选择科目</h1>
      <p class="text-body-lg" style="color:var(--color-wood);max-width:34em;margin-bottom:56px;" id="gradeHint"></p>

      <div class="subject-grid" id="subjectGrid"></div>
    </section>
  </main>

  <script src="../assets/js/app.js"></script>
  <script>
    (function () {
      if (!Qllq.guard('../index.html')) return;

      var grade = Qllq.getGrade();
      if (grade !== 'junior' && grade !== 'senior') {
        Qllq.go('grade.html');
        return;
      }

      document.getElementById('gradeCrumb').textContent = Qllq.gradeLabel(grade);
      document.getElementById('gradeHint').textContent =
        '当前阶段：' + Qllq.gradeLabel(grade) + '。点击科目查看对应学习内容。';

      document.getElementById('backBtn').addEventListener('click', function () {
        Qllq.go('grade.html');
      });

      var grid = document.getElementById('subjectGrid');
      Qllq.SUBJECTS.forEach(function (subject) {
        var card = document.createElement('button');
        card.type = 'button';
        card.className = 'subject-card';
        card.setAttribute('data-subject', subject.key);
        card.innerHTML =
          '<span class="subject-name">' + subject.name + '</span>' +
          '<span class="subject-meta">' + subject.key.toUpperCase() + '</span>';
        card.addEventListener('click', function () {
          Qllq.go('subject-home.html?grade=' + grade + '&subject=' + subject.key);
        });
        grid.appendChild(card);
      });
    })();
  </script>
</body>
</html>
