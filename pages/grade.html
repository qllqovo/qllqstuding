<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>选择年级 · qllqstuding</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='8' fill='%235a7a6b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../assets/css/nordic.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <button class="nav-back" id="backBtn" type="button">← 返回登录</button>
      <span class="breadcrumb">Step 1 / 2</span>
    </header>

    <section class="section" style="margin-top:80px;">
      <p class="text-label">Grade</p>
      <h1 class="text-display" style="margin:8px 0 16px;">请选择年级</h1>
      <p class="text-body-lg" style="color:var(--color-wood);max-width:34em;margin-bottom:56px;">
        选择学习阶段后，进入对应科目的内容列表。
      </p>

      <div class="dual-actions">
        <button type="button" class="subject-card" data-grade="junior">
          <span class="subject-name">初中</span>
          <span class="subject-meta">JUNIOR</span>
        </button>
        <button type="button" class="subject-card" data-grade="senior">
          <span class="subject-name">高中</span>
          <span class="subject-meta">SENIOR</span>
        </button>
      </div>
    </section>
  </main>

  <script src="../assets/js/app.js"></script>
  <script>
    (function () {
      if (!Qllq.guard('../index.html')) return;

      document.getElementById('backBtn').addEventListener('click', function () {
        Qllq.go('../index.html');
      });

      var buttons = document.querySelectorAll('[data-grade]');
      buttons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          var grade = btn.getAttribute('data-grade');
          Qllq.setGrade(grade);
          Qllq.go('subject.html?grade=' + grade);
        });
      });
    })();
  </script>
</body>
</html>
